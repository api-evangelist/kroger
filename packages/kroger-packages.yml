specification: API Commons Packages
specificationVersion: '0.1'
provider: Kroger
providerId: kroger
generated: '2026-08-27'
method: searched
source: >-
  Registry searches against registry.npmjs.org and pypi.org, the GitHub org
  github.com/krogertechnology, and the full Kroger developer documentation corpus
  read from the portal content API
  (https://developer.kroger.com/api/v1/developer/content/search.json, HTTP 200).
official_package_count: 0
package_count: 5
finding: >-
  Kroger publishes NO first-party client library, in any language, on any
  registry. Its documentation teaches integration entirely through raw curl and
  hand-written fetch() — the Cart, Products and Locations tutorials all build the
  HTTP call by hand. The only tooling Kroger itself distributes is a Postman
  collection plus per-environment variable files. Its public GitHub organization,
  github.com/krogertechnology, contains a single unrelated repository
  ("musical-invention", last touched 2024-08-27) and the repo backing its own
  developer docs, krogertechnology/apip-apidm-ui-docs, is private (HTTP 404
  anonymously). Every package listed below is community-maintained; none is
  endorsed, referenced or supported by Kroger.
packages:
  - name: kroger
    registry: npm
    url: https://www.npmjs.com/package/kroger
    repository: https://github.com/agg23/kroger
    language: JavaScript
    official: false
    version: 1.0.1
    published: '2018-07-31'
    description: Node module for accessing the Kroger API.
    note: >-
      Eight years stale. Predates the current Public API programme's documented
      shape; treat as abandoned.
  - name: kroger-api-wrapper
    registry: npm
    url: https://www.npmjs.com/package/kroger-api-wrapper
    repository: https://github.com/cj-larsen/kroger-api-wrapper
    language: JavaScript
    official: false
    version: 1.0.11
    published: '2022-11-26'
    description: A simple wrapper for the Kroger API.
  - name: kroger-api
    registry: pypi
    url: https://pypi.org/project/kroger-api/
    repository: https://github.com/CupOfOwls/kroger-api
    language: Python
    official: false
    version: 0.3.1
    published: '2026-07-09'
    author: Stephen Thoemmes
    description: A Python client library for the Kroger Public API.
    note: >-
      The most current community client found, and the only one maintained within
      the last two months. Points its Documentation URL at
      developer.kroger.com/documentation/public/ — it wraps the real Public API.
  - name: '@striderlabs/mcp-kroger'
    registry: npm
    url: https://www.npmjs.com/package/@striderlabs/mcp-kroger
    repository: https://github.com/markswendsen-code/mcp-kroger
    language: TypeScript
    official: false
    kind: mcp-server
    version: 0.2.1
    published: '2026-06-18'
    description: >-
      Community MCP server for Kroger — product search, cart management, coupon
      clipping. NOT a Kroger product.
  - name: '@pipeworx/mcp-kroger'
    registry: npm
    url: https://www.npmjs.com/package/@pipeworx/mcp-kroger
    repository: https://github.com/pipeworx-io/mcp-kroger
    language: TypeScript
    official: false
    kind: mcp-server
    version: 0.1.0
    published: '2026-07-15'
    description: >-
      Community MCP server exposing Kroger products, prices and store locations.
      NOT a Kroger product.
distribution_by_provider:
  - kind: postman-collection
    name: Kroger Public APIs
    official: true
    registry: postman
    version: null
    published: null
    note: >-
      Kroger publishes a forkable Postman collection and separate downloadable
      Production and Certification environment files. Version and publication
      date are not readable anonymously — the collection link and download links
      are rendered client-side on
      https://developer.kroger.com/documentation/public/getting-started/postman
      and the portal serves an HTML shell to non-JS clients. Recorded as null
      with this note rather than omitted: it was checked, not skipped.
maintainers:
