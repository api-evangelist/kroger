description: >-
  The Kroger Co. is the largest supermarket operator in the United States and runs a
  two-tier developer programme from developer.kroger.com. The Public tier is
  self-service after account and application registration and covers Products,
  Locations, Identity and Cart, each with a published daily call quota. The Partner
  tier — Carts, Catalog, Catalog V2, Identity, Locations, Products, Seamless Delivery
  and Locker Integration — is not self-service and requires a signed contractual
  agreement with Kroger. Every API is protected by OAuth 2.0 at api.kroger.com, with
  client-credentials access for catalogue and store data and authorization-code
  access, with explicit customer consent, for anything that touches a shopper's
  profile or cart. A separate certification environment runs at api-ce.kroger.com.
